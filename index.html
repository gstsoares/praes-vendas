<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#161616">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PRAES Vendas">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<title>PRAES Imóveis · Controle de Vendas</title>
<link rel="icon" href="img/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script src="data/seed.js"></script>
</head>
<body>

<!-- ===================== LOGIN ===================== -->
<section id="login" class="login hidden">
  <div class="login-card">
    <div class="login-avatar"><img src="img/guigao.jpg" alt="Guigão Guilherme Cunha"></div>
    <div class="login-name">Guigão Guilherme Cunha</div>
    <div class="login-brand">PRAES <span>Imóveis</span></div>
    <p class="login-sub">Controle Comercial · Vendas e Comissões</p>
    <form id="loginForm" autocomplete="on">
      <label>E-mail<input id="lgUser" name="email" type="email" autocomplete="username" required placeholder="seu@email.com"></label>
      <label>Senha<input id="lgPass" name="password" type="password" autocomplete="current-password" required placeholder="••••••"></label>
      <button class="btn gold block" type="submit">Entrar</button>
      <div id="lgErr" class="err"></div>
      <div id="lgOk" class="ok-msg"></div>
    </form>
    <button class="login-link" id="lgEsqueci" type="button">Esqueci minha senha</button>
    <div id="demoHint" class="demo-hint hidden">
      <b>Modo demonstração</b> (Firebase ainda não configurado)<br>
      <code>guigao@exemplo.com</code> (master) · <code>fag@exemplo.com</code> (administrador)<br><code>servantes@exemplo.com</code> (gerente) · <code>selenna@exemplo.com</code> (corretor)<br>senha <code>123456</code>
    </div>
  </div>
</section>

<!-- ===================== APP ===================== -->
<div id="app" class="app hidden">
  <aside class="side" id="side">
    <div class="side-user">
      <div class="avatar xl" id="sideAvatar"></div>
      <div class="side-name" id="sideName"></div>
      <div class="side-role" id="sideRole"></div>
    </div>
    <nav id="nav"></nav>
    <div class="side-foot">
      <div class="brand-mini">PRAES <span>Imóveis</span></div>
      <button class="btn ghost sm" id="btnSair">Sair</button>
    </div>
  </aside>
  <div class="main">
    <header class="top">
      <button class="hamb" id="hamb" aria-label="Menu">☰</button>
      <h1 id="pageTitle"></h1>
      <div class="top-actions" id="topActions"></div>
      <span class="demo-tag hidden" id="demoTag">DEMONSTRAÇÃO</span>
    </header>
    <main id="view" class="view"></main>
  </div>
</div>

<div id="modal" class="modal hidden"><div class="modal-box" id="modalBox"></div></div>
<div id="toast" class="toast"></div>

<script type="module" src="js/app.js?v=3"></script>
<script>if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register("sw.js", { updateViaCache: "none" }).catch(() => {});</script>
</body>
</html>
